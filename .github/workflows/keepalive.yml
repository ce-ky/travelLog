name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days idle. A daily API ping keeps
# the inactivity timer reset — from the cloud, so it doesn't need any machine on.
on:
  schedule:
    - cron: "30 4 * * *" # daily at 04:30 UTC
  workflow_dispatch: # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          # Publishable (client) key — safe to keep here; RLS guards the data.
          SUPABASE_URL: https://ystuycqwumhhhapdsuss.supabase.co
          SUPABASE_KEY: sb_publishable_Yybepofpr5GTQEiXFIXC7Q_RpadLkZC
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            --max-time 30 \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1")
          echo "Supabase responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::keep-alive ping failed (HTTP $code)"
            exit 1
          fi
