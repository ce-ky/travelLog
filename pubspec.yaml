name: travel_log
description: A cross-platform travel journal — map, trips, photos, stories and drawings in one place.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2          # simple state management for the skeleton
  flutter_map: ^7.0.2       # OpenStreetMap-based map, no API key needed
  latlong2: ^0.9.1          # LatLng type used by flutter_map
  intl: ^0.19.0             # date formatting / grouping
  image_picker: ^1.1.2      # photo & drawing (jpg) uploads — used later
  supabase_flutter: ^2.8.0  # auth + Postgres + storage backend
  uuid: ^4.5.1              # client-generated ids, so offline records have identity

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
